<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont,
          "Segoe UI", system-ui, sans-serif;
        font-size: 16px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #111827, #1f2937);
        color: #f3f4f6;
      }

      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 2.5rem;
        width: min(960px, 92vw);
        padding: clamp(1.5rem, 3vw, 3rem);
        border-radius: 1.75rem;
        background: rgba(17, 24, 39, 0.8);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow:
          0 30px 60px rgba(15, 23, 42, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .hero {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        align-self: center;
      }

      .hero h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 700;
        line-height: 1.1;
      }

      .hero p {
        font-size: 1.05rem;
        color: rgba(229, 231, 235, 0.8);
        max-width: 40ch;
      }

      .login-card {
        background: rgba(15, 23, 42, 0.9);
        border-radius: 1.5rem;
        padding: clamp(1.5rem, 4vw, 2.5rem);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          0 15px 35px rgba(15, 23, 42, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .login-card header {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-bottom: 1.75rem;
      }

      .login-card header h2 {
        font-size: 1.75rem;
        font-weight: 600;
      }

      .login-card header span {
        color: rgba(209, 213, 219, 0.7);
        font-size: 0.95rem;
      }

      form {
        display: grid;
        gap: 1.25rem;
      }

      label {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 0.55rem;
        color: rgba(229, 231, 235, 0.85);
      }

      .input-group {
        display: flex;
        flex-direction: column;
      }

      input[type="email"],
      input[type="password"] {
        appearance: none;
        width: 100%;
        padding: 0.85rem 1rem;
        border-radius: 0.9rem;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(17, 24, 39, 0.8);
        color: inherit;
        font-size: 1rem;
        transition: border 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }

      input[type="email"]:focus,
      input[type="password"]:focus {
        border-color: rgba(129, 140, 248, 0.8);
        box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.25);
        outline: none;
        transform: translateY(-1px);
      }

      .field-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 0.5rem;
      }

      .field-footer label {
        margin-bottom: 0;
        display: flex;
        align-items: center;
        gap: 0.45rem;
      }

      .field-footer input[type="checkbox"] {
        accent-color: #818cf8;
        transform: scale(1.05);
      }

      .field-footer a {
        color: #a855f7;
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.2s ease;
      }

      .field-footer a:hover {
        color: #c084fc;
      }

      button[type="submit"] {
        appearance: none;
        border: none;
        border-radius: 0.9rem;
        padding: 0.9rem 1.1rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(135deg, #6366f1, #ec4899);
        color: #f9fafb;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 0.65rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 12px 25px rgba(99, 102, 241, 0.35);
      }

      button[type="submit"]:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 30px rgba(99, 102, 241, 0.4);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.85rem;
        color: rgba(209, 213, 219, 0.6);
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(148, 163, 184, 0.25);
      }

      .social-buttons {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      }

      .social-buttons button {
        background: rgba(17, 24, 39, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: inherit;
        padding: 0.85rem 1rem;
        border-radius: 0.85rem;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 0.6rem;
        cursor: pointer;
        font-size: 0.95rem;
        transition: border 0.2s ease, transform 0.2s ease, color 0.2s ease;
      }

      .social-buttons button:hover {
        border-color: rgba(129, 140, 248, 0.6);
        transform: translateY(-1px);
        color: #e0e7ff;
      }

      .signup-cta {
        margin-top: 1.5rem;
        display: flex;
        justify-content: center;
        gap: 0.35rem;
        font-size: 0.95rem;
        color: rgba(209, 213, 219, 0.75);
      }

      .signup-cta a {
        color: #818cf8;
        text-decoration: none;
        font-weight: 600;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.4rem 0.85rem;
        border-radius: 999px;
        font-size: 0.85rem;
        background: rgba(129, 140, 248, 0.15);
        color: #c7d2fe;
        width: fit-content;
      }

      .features {
        display: grid;
        gap: 1.1rem;
        margin-top: 1.25rem;
      }

      .feature-item {
        display: flex;
        gap: 0.75rem;
        align-items: flex-start;
      }

      .feature-icon {
        width: 2.25rem;
        height: 2.25rem;
        background: rgba(129, 140, 248, 0.15);
        border: 1px solid rgba(129, 140, 248, 0.25);
        border-radius: 0.75rem;
        display: grid;
        place-items: center;
        color: #a5b4fc;
      }

      .feature-content h3 {
        font-size: 1.1rem;
        margin-bottom: 0.45rem;
      }

      .feature-content p {
        font-size: 0.92rem;
        color: rgba(209, 213, 219, 0.65);
      }

      .error-message {
        display: none;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        border-radius: 0.9rem;
        background: rgba(239, 68, 68, 0.1);
        color: #fca5a5;
        font-size: 0.9rem;
        border: 1px solid rgba(248, 113, 113, 0.25);
      }

      .error-message svg {
        width: 1.25rem;
        height: 1.25rem;
      }

      @media (max-width: 720px) {
        main {
          border-radius: 1.2rem;
          padding: 2rem clamp(1rem, 4vw, 1.75rem);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <span class="badge">✨ 새로운 경험을 시작하세요</span>
        <h1>당신의 공간에 다시 오신 걸 환영해요</h1>
        <p>
          단일 계정으로 모든 서비스를 이용하세요. 안전한 인증과 섬세한 사용 경험을
          통해 더 편리한 하루를 만들어드립니다.
        </p>
        <div class="features">
          <article class="feature-item">
            <div class="feature-icon">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M19 11l-6.5 6L5 11"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M19 7l-6.5 6L5 7"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  opacity="0.5"
                />
              </svg>
            </div>
            <div class="feature-content">
              <h3>설정 동기화</h3>
              <p>어디서든 동일한 환경으로 업무와 일상을 이어가세요.</p>
            </div>
          </article>
          <article class="feature-item">
            <div class="feature-icon">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M4.75 6.75h14.5"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
                <path
                  d="M6.5 6.75l.54 10.3a1.75 1.75 0 001.74 1.7h6.44a1.75 1.75 0 001.74-1.7l.54-10.3"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M9.5 6.75v-.5a2.5 2.5 0 015 0v.5"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <div class="feature-content">
              <h3>강화된 보안</h3>
              <p>멀티팩터 인증과 실시간 보호로 내 데이터는 안전하게.</p>
            </div>
          </article>
        </div>
      </section>

      <section class="login-card" aria-label="로그인 폼">
        <header>
          <h2>로그인</h2>
          <span>계정 정보를 입력하고, 서비스를 시작하세요.</span>
        </header>

        <div class="error-message" role="alert" aria-live="polite">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M12 9v4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <circle
              cx="12"
              cy="16"
              r=".9"
              fill="currentColor"
              opacity="0.8"
            />
            <path
              d="M12 4a1.5 1.5 0 011.3.75l6.6 11.5a1.5 1.5 0 01-1.3 2.25H5.4a1.5 1.5 0 01-1.3-2.25l6.6-11.5A1.5 1.5 0 0112 4z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
          <span>이메일과 비밀번호를 모두 입력해주세요.</span>
        </div>

        <form id="login-form" novalidate>
          <div class="input-group">
            <label for="email">이메일</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="이메일 주소를 입력하세요"
              autocomplete="email"
              required
            />
          </div>

          <div class="input-group">
            <label for="password">비밀번호</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="비밀번호를 입력하세요"
              autocomplete="current-password"
              required
              minlength="8"
            />
          </div>

          <div class="field-footer">
            <label>
              <input type="checkbox" name="remember" />
              로그인 상태 유지
            </label>
            <a href="#">비밀번호를 잊으셨나요?</a>
          </div>

          <button type="submit">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              width="20"
              height="20"
              aria-hidden="true"
            >
              <path
                d="M5 12h14"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="M13 6l6 6-6 6"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            로그인하기
          </button>
        </form>

        <div class="divider">또는</div>

        <div class="social-buttons">
          <button type="button" aria-label="Google 계정으로 로그인">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
              <path
                d="M21.6 12.227c0-.764-.069-1.497-.198-2.2H12v4.162h5.38a4.596 4.596 0 01-1.99 3.013v2.507h3.22c1.883-1.733 2.99-4.287 2.99-7.482z"
                fill="#4285F4"
              />
              <path
                d="M12 22c2.7 0 4.963-.897 6.617-2.39l-3.22-2.507c-.897.6-2.045.954-3.397.954-2.613 0-4.828-1.766-5.62-4.142H3.04v2.601A10 10 0 0012 22z"
                fill="#34A853"
              />
              <path
                d="M6.38 13.915A5.99 5.99 0 015.875 12c0-.66.115-1.215.505-1.915V7.484H3.04A9.995 9.995 0 002 12c0 1.645.405 3.195 1.04 4.516l3.34-2.601z"
                fill="#FBBC05"
              />
              <path
                d="M12 6.352a5.426 5.426 0 013.83 1.497l2.85-2.85C16.963 3.4 14.7 2.5 12 2.5 8.313 2.5 5.214 4.66 3.04 7.484l3.34 2.601C7.172 8.915 9.387 7.148 12 7.148c.204 0 .402.014.6.04V6.352z"
                fill="#EA4335"
              />
            </svg>
            Google
          </button>
          <button type="button" aria-label="Apple 계정으로 로그인">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path
                d="M18.71 15.46c-.35.81-.77 1.56-1.27 2.28-.67.98-1.23 1.65-1.68 2.01-.66.6-1.37.91-2.12.93-.54 0-1.19-.15-1.94-.45-.76-.3-1.45-.45-2.07-.45-.65 0-1.36.15-2.13.45-.78.3-1.39.46-1.84.48-.73.03-1.47-.28-2.23-.93-.48-.39-1.07-1.08-1.77-2.1-.76-1.09-1.39-2.36-1.88-3.81-.52-1.59-.78-3.13-.78-4.62 0-1.71.37-3.19 1.1-4.44.57-.98 1.33-1.76 2.27-2.33.94-.58 1.95-.88 3.02-.91.59 0 1.36.18 2.31.53.95.36 1.56.54 1.82.54.2 0 .87-.21 2-.63 1.07-.38 1.98-.54 2.73-.49 2.02.16 3.54.98 4.56 2.45-1.81 1.1-2.71 2.66-2.71 4.68 0 1.56.58 2.86 1.73 3.88.51.45 1.07.8 1.68 1.07-.13.38-.27.75-.43 1.11z"
              />
              <path
                d="M16.55 2.88c0 1.1-.4 2.04-1.2 2.82-.96.92-2.09 1.46-3.3 1.37a3.6 3.6 0 01-.03-.44c0-1.05.46-2.05 1.27-2.84.41-.41.92-.74 1.52-.99a3.5 3.5 0 011.64-.32c.07.13.1.26.1.4z"
              />
            </svg>
            Apple
          </button>
        </div>

        <p class="signup-cta">
          아직 계정이 없으신가요?
          <a href="#">회원가입</a>
        </p>
      </section>
    </main>

    <script>
      const form = document.querySelector("#login-form");
      const emailInput = document.querySelector("#email");
      const passwordInput = document.querySelector("#password");
      const errorMessage = document.querySelector(".error-message");

      const toggleError = (visible, message) => {
        if (!errorMessage) return;
        errorMessage.style.display = visible ? "flex" : "none";
        errorMessage.querySelector("span").textContent =
          message || "이메일과 비밀번호를 모두 입력해주세요.";
      };

      form?.addEventListener("submit", (event) => {
        event.preventDefault();

        const email = emailInput?.value.trim();
        const password = passwordInput?.value.trim();

        if (!email || !password) {
          toggleError(true, "이메일과 비밀번호를 모두 입력해주세요.");
          return;
        }

        if (!/\S+@\S+\.\S+/.test(email)) {
          toggleError(true, "올바른 이메일 주소를 입력해주세요.");
          return;
        }

        if (password.length < 8) {
          toggleError(true, "비밀번호는 최소 8자 이상이어야 합니다.");
          return;
        }

        toggleError(false);

        const payload = {
          email,
          password,
          remember: form.remember?.checked ?? false,
        };

        console.log("Login payload", payload);
        form.reset();
        alert("로그인 요청이 전송되었습니다. 콘솔을 확인하세요.");
      });
    </script>
  </body>
</html>
